// internal/shared/proto/user/user.proto
syntax = "proto3";

package user;

option go_package = "./;userpb";

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
  string username = 2;
  bool success = 3;
}