syntax = "proto3";

package common;

option go_package = "github.com/liling4271/freedom/internal/shared/proto/common";

// 分页请求
message PaginationRequest {
    int32 page = 1;      // 页码，从1开始
    int32 page_size = 2; // 每页大小
}

// 分页响应
message PaginationResponse {
    int32 total = 1;     // 总记录数
    int32 page = 2;      // 当前页码
    int32 page_size = 3; // 每页大小
    int32 pages = 4;     // 总页数
}

// 空响应
message Empty {}

// 基础响应
message BaseResponse {
    bool success = 1;
    string message = 2;
}

// ID请求
message IDRequest {
    string id = 1;
}